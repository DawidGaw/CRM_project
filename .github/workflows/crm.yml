name: CRM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.13'

jobs:
  lint_test:
    runs-on: ubuntu-latest
    name: Code Quality & Lint

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install -r requirements.txt ruff mypy bandit safety

    - name: Run Ruff
      run: ruff check CRM

    - name: Run mypy
      run: mypy CRM --config-file pyproject.toml
      continue-on-error: true


    - name: Run bandit
      run: bandit -r CRM

    - name: Run safety
      run: safety check
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        cd CRM
        coverage run --source='.' manage.py test
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./CRM/coverage.xml
        fail_ci_if_error: true